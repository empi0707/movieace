server {
    listen 80;
    server_name _;

    root /var/www/movieace/dist;
    index index.html;

    # Vue Router (history mode) fallback: let the SPA handle any route
    # that isn't a real file/directory, instead of returning a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-term caching for hashed build assets
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML shell so deploys take effect immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;
}
